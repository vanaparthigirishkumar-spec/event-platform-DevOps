services:
  mongodb:
    image: mongo:7.0
    container_name: event-platform-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: eventplatform
    volumes:
      - mongodb_data:/data/db
    networks:
      - event-platform-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/eventplatform --quiet
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: event-platform-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/eventplatform
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRATION: 900000
      JWT_REFRESH_TOKEN_EXPIRATION: 604800000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - event-platform-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: event-platform-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - event-platform-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  mongodb_data:
    driver: local

networks:
  event-platform-network:
    driver: bridge