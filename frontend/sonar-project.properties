# SonarQube Configuration for Frontend
sonar.projectKey=flm-cloud-native-platform-frontend
sonar.projectName=Event Platform Frontend
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src
sonar.tests=src/tests

# Language
sonar.language=typescript

# Encoding
sonar.sourceEncoding=UTF-8

# Test reports
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts

# Coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/vite.config.ts,**/vitest.config.ts,**/*.config.ts,**/*.config.js

# Quality Gate
sonar.qualitygate.wait=true