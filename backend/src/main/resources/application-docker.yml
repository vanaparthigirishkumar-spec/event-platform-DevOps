spring:
  application:
    name: event-platform-backend

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/eventplatform}
      auto-index-creation: true

  security:
    jwt:
      access-secret: ${JWT_SECRET}
      refresh-secret: ${JWT_SECRET}
      access-expiry: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
      refresh-expiry: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}

  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:3000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mongo:
      enabled: true

logging:
  level:
    com.eventplatform: INFO
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"