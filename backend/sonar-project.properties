# SonarQube Configuration for Backend
sonar.projectKey=flm-cloud-native-platform-backend
sonar.projectName=Event Platform Backend
sonar.projectVersion=1.0.0-SNAPSHOT

# Source directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Language
sonar.language=java

# Encoding
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=21
sonar.java.target=21

# Test reports
sonar.junit.reportPaths=target/surefire-reports
sonar.jacoco.reportPaths=target/site/jacoco/jacoco.xml

# Binaries for analysis
sonar.java.binaries=target/classes

# Exclusions
sonar.exclusions=**/target/**,**/generated/**,**/*.xml

# Quality Gate
sonar.qualitygate.wait=true